name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features librazer/diagnostic-gpu --locked
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rhelper-windows
          path: |
            target/release/rhelper.exe
            target/release/rhelper-diagnostics.exe
            target/release/rhelper-display.exe
            target/release/rhelper-features.exe
            LICENSE
            NOTICE
            THIRD_PARTY_LICENSES.md
