name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features librazer/diagnostic-gpu --locked
      - run: cargo test --workspace --features librazer/diagnostic-gpu --locked
      - name: Check diagnostic analysis and PowerShell syntax
        shell: pwsh
        run: |
          python tools/test_sensor_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'Sensor analysis tests failed.' }
          foreach ($script in Get-ChildItem tools -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "$($script.Name): $($errors -join '; ')" }
          }
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rhelper-windows
          path: |
            target/release/rhelper.exe
            target/release/rhelper-diagnostics.exe
            target/release/rhelper-display.exe
            target/release/rhelper-features.exe
            target/release/rhelper-controls.exe
            LICENSE
            NOTICE
            THIRD_PARTY_LICENSES.md
