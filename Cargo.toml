[package]
name = "r-helper"
version = "0.6.0"
edition = "2021"
description = "R-Helper - Razer Blade control interface"
authors = ["Fatalution"]

[[bin]]
name = "rhelper"
path = "src/main.rs"

[dependencies]
eframe = "0.32.2"
anyhow = "1.0.89"
librazer = { path = "./librazer" }
image = "0.25.8"
strum = { version = "0.26.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26.1"
global-hotkey = "0.8.0"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
    ,"Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation",
    "Win32_System_Services", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"
] }

[build-dependencies]
embed-resource = "3.0.5"

[workspace]
resolver = "2"
exclude = ["vendor/eframe"]
members = [
    ".",          # r-helper (GUI)
    "librazer",   # shared lib
]
default-members = [
    ".",          # build only the GUI by default (root crate)
]

[patch.crates-io]
# Backport upstream egui #8398 to our existing API version; see vendor/eframe/PATCHES.md.
eframe = { path = "vendor/eframe" }
