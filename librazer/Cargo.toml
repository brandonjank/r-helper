[package]
name = "librazer"
version = "0.8.5"
edition = "2021"
license = "MIT"
description = "Librazer fork adapted from blauzim/razer-ctl"
readme = "../README.md"

[features]
diagnostic-gpu = ["dep:wgpu"]

[[bin]]
name = "rhelper-gpu-test"
path = "src/bin/rhelper-gpu-test.rs"
required-features = ["diagnostic-gpu"]

[dependencies]
anyhow = "1.0.80"
bincode = "1.3.3"
clap = { version = "4.5.1", features = ["derive"] }
const-str = "0.5.7"
const_format = "0.2.32"
hidapi = {version = "2.6.1", features = ["windows-native"]}
rand = "0.8.5"
serde = { version = "1.0.197", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.114"
strum = "0.26.1"
strum_macros = "0.26.1"
wgpu = { version = "25.0.2", optional = true, default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["Win32_System_Power", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_System_Com", "Devices_Lights", "Devices_Enumeration", "Foundation", "System", "UI"] }
winreg = { version = "0.52", features = ["transactions"] }
